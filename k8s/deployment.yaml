apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilot-app
  namespace: pilot-app
  labels:
    app: pilot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pilot-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: pilot-app
    spec:
      containers:
      - name: pilot-app
        image: chandrapilotacr.azurecr.io/pilot-app:v1
        ports:
        - containerPort: 3000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
